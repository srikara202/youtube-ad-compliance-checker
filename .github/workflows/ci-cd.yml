name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend run test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Vendor Python packages for App Service
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            --volume "$PWD:/app" \
            --workdir /app \
            python:3.12-bullseye \
            bash -lc '
              python -m pip install --upgrade pip &&
              rm -rf python_packages &&
              mkdir -p python_packages/lib/site-packages &&
              pip install --target python_packages/lib/site-packages -r requirements.txt
            '

      - name: Write deployment metadata
        if: github.event_name == 'push'
        run: |
          cat > deployment-info.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload deployment package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          retention-days: 7
          path: |
            .
            !.git/**
            !.github/**
            !.venv/**
            !__pycache__/**
            !backend/**/__pycache__/**
            !backend/tests/**
            !frontend/node_modules/**
            !frontend/src/**
            !frontend/*.tsbuildinfo

  deploy:
    name: Deploy to Azure App Service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: webapp-package

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve Azure Web App
        id: webapp
        run: |
          set -euo pipefail
          app_name="${{ secrets.AZURE_WEBAPP_NAME }}"
          resource_group="$(az webapp list --query "[?name=='${app_name}'].resourceGroup | [0]" --output tsv)"
          if [ -z "$resource_group" ] || [ "$resource_group" = "null" ]; then
            echo "::error::Could not find the configured Azure Web App."
            exit 1
          fi
          default_host="$(az webapp show --resource-group "$resource_group" --name "$app_name" --query defaultHostName --output tsv)"
          echo "resource-group=${resource_group}" >> "$GITHUB_OUTPUT"
          echo "url=https://${default_host}" >> "$GITHUB_OUTPUT"

      - name: Configure App Service for prebuilt package deploy
        run: |
          set -euo pipefail
          app_name="${{ secrets.AZURE_WEBAPP_NAME }}"
          resource_group="${{ steps.webapp.outputs.resource-group }}"
          az webapp config set \
            --resource-group "$resource_group" \
            --name "$app_name" \
            --startup-file "bash startup.sh" \
            --output none
          az webapp config appsettings set \
            --resource-group "$resource_group" \
            --name "$app_name" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=false ENABLE_ORYX_BUILD=false \
            --output none
          az webapp config appsettings delete \
            --resource-group "$resource_group" \
            --name "$app_name" \
            --setting-names WEBSITE_RUN_FROM_PACKAGE \
            --output none || true

      - name: Create zip deployment package
        run: |
          set -euo pipefail
          (cd webapp-package && zip -rq ../webapp-package.zip .)
          unzip -l webapp-package.zip | grep -E 'deployment-info.json|backend/src/api/billing.py|backend/src/api/server.py'

      - name: Deploy prebuilt zip package to Azure Web App
        run: |
          set -euo pipefail
          app_name="${{ secrets.AZURE_WEBAPP_NAME }}"
          resource_group="${{ steps.webapp.outputs.resource-group }}"
          az webapp deploy \
            --resource-group "$resource_group" \
            --name "$app_name" \
            --src-path webapp-package.zip \
            --type zip \
            --clean true \
            --restart true \
            --track-status true \
            --timeout 900000
          az webapp restart --resource-group "$resource_group" --name "$app_name" --output none

      - name: Smoke test deployed billing API
        run: |
          set -euo pipefail
          app_url="${{ steps.webapp.outputs.url }}"
          for attempt in {1..30}; do
            openapi="$(curl -fsS "$app_url/openapi.json" || true)"
            if grep -q '"/billing/me"' <<< "$openapi"; then
              health="$(curl -fsS "$app_url/health" || true)"
              if grep -q "${GITHUB_SHA}" <<< "$health"; then
                echo "Billing API and deployment metadata are live on the configured Azure Web App."
                echo "$health"
                exit 0
              fi
            fi
            echo "Waiting for the deployed billing API to become live (attempt ${attempt}/30)."
            sleep 10
          done
          echo "Final deployed health response:"
          curl -fsS "$app_url/health" || true
          echo "::error::The configured Azure Web App did not expose /billing/me after deployment."
          exit 1
