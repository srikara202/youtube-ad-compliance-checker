name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: python -m unittest discover -s backend/tests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm --prefix frontend run test

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Vendor Python packages for App Service
        if: github.event_name == 'push'
        run: |
          docker run --rm \
            --volume "$PWD:/app" \
            --workdir /app \
            python:3.12-bullseye \
            bash -lc '
              python -m pip install --upgrade pip &&
              rm -rf python_packages &&
              mkdir -p python_packages/lib/site-packages &&
              pip install --target python_packages/lib/site-packages -r requirements.txt
            '

      - name: Write deployment metadata
        if: github.event_name == 'push'
        run: |
          cat > deployment-info.json <<EOF
          {
            "commit_sha": "${GITHUB_SHA}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "deployed_at_utc": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          }
          EOF

      - name: Upload deployment package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: webapp-package
          retention-days: 7
          path: |
            .
            !.git/**
            !.github/**
            !.venv/**
            !__pycache__/**
            !backend/**/__pycache__/**
            !backend/tests/**
            !frontend/node_modules/**
            !frontend/src/**
            !frontend/*.tsbuildinfo

  deploy:
    name: Deploy to Azure App Service
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: webapp-package
          path: webapp-package

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: webapp-package

      - name: Smoke test deployed billing API
        run: |
          set -euo pipefail
          app_url="https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net"
          for attempt in {1..30}; do
            openapi="$(curl -fsS "$app_url/openapi.json" || true)"
            if grep -q '"/billing/me"' <<< "$openapi"; then
              echo "Billing API is live on the configured Azure Web App."
              curl -fsS "$app_url/health"
              exit 0
            fi
            echo "Waiting for the deployed billing API to become live (attempt ${attempt}/30)."
            sleep 10
          done
          echo "::error::The configured Azure Web App did not expose /billing/me after deployment."
          exit 1
